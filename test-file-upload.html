<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test File Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .upload-section {
            border: 2px dashed #ccc;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        .file-list {
            margin-top: 20px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            margin: 5px 0;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-success { background-color: #28a745; color: white; }
    </style>
</head>
<body>
    <h1>Test Multiple File Upload for Appointments</h1>
    
    <div class="upload-section">
        <h3>Upload Supporting Documents (Max 5 files)</h3>
        <input type="file" id="fileInput" multiple accept="image/jpeg,image/jpg,image/png,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain">
        <br><br>
        <button class="btn-primary" onclick="selectFiles()">Select Files</button>
        <button class="btn-success" onclick="uploadFiles()">Upload Test</button>
        <button class="btn-danger" onclick="clearFiles()">Clear All</button>
        
        <div id="fileList" class="file-list"></div>
        <div id="uploadResult" style="margin-top: 20px;"></div>
    </div>

    <script>
        let selectedFiles = [];
        const MAX_FILES = 5;
        const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB

        function selectFiles() {
            document.getElementById('fileInput').click();
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            
            if (selectedFiles.length + files.length > MAX_FILES) {
                alert(`You can only upload up to ${MAX_FILES} files.`);
                return;
            }

            const allowedTypes = [
                'image/jpeg', 'image/jpg', 'image/png', 'image/webp',
                'application/pdf', 'application/msword', 
                'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                'text/plain'
            ];

            files.forEach(file => {
                if (!allowedTypes.includes(file.type)) {
                    alert(`File "${file.name}" is not supported. Please upload images or documents only (no videos).`);
                    return;
                }

                if (file.size > MAX_FILE_SIZE) {
                    alert(`File "${file.name}" is too large. Maximum file size is 10MB.`);
                    return;
                }

                selectedFiles.push(file);
            });

            displayFiles();
            e.target.value = ''; // Clear input
        });

        function displayFiles() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            if (selectedFiles.length === 0) {
                fileList.innerHTML = '<p>No files selected</p>';
                return;
            }

            fileList.innerHTML = `<h4>Selected Files (${selectedFiles.length}/${MAX_FILES}):</h4>`;
            
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                
                const fileInfo = document.createElement('span');
                fileInfo.textContent = `${file.name} (${formatFileSize(file.size)})`;
                
                const removeBtn = document.createElement('button');
                removeBtn.textContent = 'Remove';
                removeBtn.className = 'btn-danger';
                removeBtn.onclick = () => removeFile(index);
                
                fileItem.appendChild(fileInfo);
                fileItem.appendChild(removeBtn);
                fileList.appendChild(fileItem);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFiles();
        }

        function clearFiles() {
            selectedFiles = [];
            displayFiles();
            document.getElementById('uploadResult').innerHTML = '';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function uploadFiles() {
            if (selectedFiles.length === 0) {
                alert('Please select files first.');
                return;
            }

            const formData = new FormData();
            
            // Add sample appointment data
            formData.append('patientappointmentstatus', 'Pending');
            formData.append('patientappointmentlastname', 'Test');
            formData.append('patientappointmentfirstname', 'User');
            formData.append('patientappointmentemail', 'test@example.com');
            formData.append('patientadditionalappointmentnotes', 'Test appointment with file uploads');

            // Add files
            selectedFiles.forEach(file => {
                formData.append('supportingdocuments', file);
            });

            document.getElementById('uploadResult').innerHTML = '<p>Uploading...</p>';

            fetch('/api/patientappointments/appointments', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                console.log('Upload response:', data);
                if (data.message || data.patientappointmentid) {
                    document.getElementById('uploadResult').innerHTML = 
                        `<p style="color: green;">✅ Upload successful! Appointment ID: ${data.patientappointmentid || 'N/A'}</p>
                         <p>Supporting documents: ${data.patientsupportingdocuments?.length || 0}</p>`;
                } else {
                    document.getElementById('uploadResult').innerHTML = 
                        `<p style="color: red;">❌ Upload failed: ${data.message || 'Unknown error'}</p>`;
                }
            })
            .catch(error => {
                console.error('Upload error:', error);
                document.getElementById('uploadResult').innerHTML = 
                    `<p style="color: red;">❌ Upload failed: ${error.message}</p>`;
            });
        }

        // Initialize display
        displayFiles();
    </script>
</body>
</html>
