<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Appointment CRUD Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .token-input { width: 100%; padding: 8px; margin: 10px 0; }
        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 3px; white-space: pre-wrap; }
        input[type="number"] { width: 200px; padding: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Patient Appointment Cancel/Delete Test</h1>
    <p>This test checks if patients can cancel and delete their own appointments.</p>
    
    <div class="test-section">
        <h3>Test Settings</h3>
        <label>Patient Token:</label>
        <input type="text" id="patientToken" class="token-input" placeholder="Enter patient token (patienttoken)">
        
        <label>Appointment ID to Test:</label>
        <input type="number" id="appointmentId" placeholder="Enter appointment ID (e.g., 171)">
        
        <button onclick="testAppointmentOperations()">Test Patient Appointment Operations</button>
    </div>

    <div id="results" class="test-section">
        <h3>Test Results</h3>
        <div id="testOutput" class="result">Fill in the fields above and click "Test Patient Appointment Operations" to start testing...</div>
    </div>

    <script>
        async function testAppointmentOperations() {
            const token = document.getElementById('patientToken').value;
            const appointmentId = document.getElementById('appointmentId').value;
            const output = document.getElementById('testOutput');
            
            if (!token || !appointmentId) {
                output.textContent = '❌ Please enter both patient token and appointment ID';
                output.className = 'result error';
                return;
            }

            output.textContent = 'Testing Patient Appointment Operations...\n';
            output.className = 'result';

            let results = '';
            let allPassed = true;

            // Test 1: Get appointment details first
            try {
                results += `🔍 Test 1: Get Appointment Details\n`;
                results += `   Appointment ID: ${appointmentId}\n`;
                
                const getResponse = await fetch(`/api/patientappointments/appointments/${appointmentId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (getResponse.ok) {
                    const appointment = await getResponse.json();
                    results += `   ✅ SUCCESS: Found appointment for ${appointment.patientappointmentfirstname} ${appointment.patientappointmentlastname}\n`;
                    results += `   📧 Email: ${appointment.patientappointmentemail}\n`;
                    results += `   📅 Status: ${appointment.patientappointmentstatus || 'N/A'}\n`;
                    results += `   🏥 Ambher Status: ${appointment.patientambherappointmentstatus || 'N/A'}\n`;
                    results += `   🏥 Bautista Status: ${appointment.patientbautistaappointmentstatus || 'N/A'}\n`;
                } else {
                    allPassed = false;
                    const errorText = await getResponse.text();
                    results += `   ❌ FAILED: Status ${getResponse.status} - ${errorText}\n`;
                }
            } catch (error) {
                allPassed = false;
                results += `   ❌ ERROR: ${error.message}\n`;
            }

            results += `\n`;

            // Test 2: Test appointment cancellation (UPDATE)
            try {
                results += `🔍 Test 2: Cancel Appointment (PUT)\n`;
                results += `   Attempting to cancel appointment ${appointmentId}...\n`;
                
                const cancelData = {
                    patientambherappointmentstatus: 'Cancelled',
                    patientbautistaappointmentstatus: 'Cancelled'
                };

                const putResponse = await fetch(`/api/patientappointments/appointments/${appointmentId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(cancelData)
                });

                if (putResponse.ok) {
                    const updatedAppointment = await putResponse.json();
                    results += `   ✅ SUCCESS: Appointment cancelled successfully!\n`;
                    results += `   📅 New Ambher Status: ${updatedAppointment.patientambherappointmentstatus || 'N/A'}\n`;
                    results += `   📅 New Bautista Status: ${updatedAppointment.patientbautistaappointmentstatus || 'N/A'}\n`;
                } else {
                    allPassed = false;
                    const errorText = await putResponse.text();
                    results += `   ❌ FAILED: Status ${putResponse.status} - ${errorText}\n`;
                    
                    // Try to parse error response
                    try {
                        const errorObj = JSON.parse(errorText);
                        results += `   📋 Error Details: ${errorObj.message}\n`;
                    } catch (e) {
                        results += `   📋 Raw Error: ${errorText}\n`;
                    }
                }
            } catch (error) {
                allPassed = false;
                results += `   ❌ ERROR: ${error.message}\n`;
            }

            results += `\n`;

            // Test 3: Test appointment deletion (DELETE) - Only run if user confirms
            const confirmDelete = confirm(`Do you want to test DELETING appointment ${appointmentId}? This will permanently remove the appointment!`);
            
            if (confirmDelete) {
                try {
                    results += `🔍 Test 3: Delete Appointment (DELETE)\n`;
                    results += `   ⚠️  WARNING: This will permanently delete the appointment!\n`;
                    results += `   Attempting to delete appointment ${appointmentId}...\n`;
                    
                    const deleteResponse = await fetch(`/api/patientappointments/appointments/${appointmentId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (deleteResponse.ok) {
                        results += `   ✅ SUCCESS: Appointment deleted successfully!\n`;
                    } else {
                        allPassed = false;
                        const errorText = await deleteResponse.text();
                        results += `   ❌ FAILED: Status ${deleteResponse.status} - ${errorText}\n`;
                        
                        // Try to parse error response
                        try {
                            const errorObj = JSON.parse(errorText);
                            results += `   📋 Error Details: ${errorObj.message}\n`;
                        } catch (e) {
                            results += `   📋 Raw Error: ${errorText}\n`;
                        }
                    }
                } catch (error) {
                    allPassed = false;
                    results += `   ❌ ERROR: ${error.message}\n`;
                }
            } else {
                results += `🔍 Test 3: Delete Appointment (DELETE)\n`;
                results += `   ⏭️  SKIPPED: User chose not to test deletion\n`;
            }

            // Summary
            results += `\n${'='.repeat(50)}\n`;
            if (allPassed) {
                results += '🎉 ALL TESTS PASSED!\n';
                results += 'Patients can now cancel/delete their own appointments!\n';
                output.className = 'result success';
            } else {
                results += '⚠️ SOME TESTS FAILED!\n';
                results += 'There may still be authorization issues.\n';
                output.className = 'result error';
            }

            output.textContent = results;
        }
    </script>
</body>
</html>
